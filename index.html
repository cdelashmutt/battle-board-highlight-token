<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turn Highlighter</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, sans-serif;
        background: #1e1e2e;
        color: #cdd6f4;
        padding: 16px;
        min-height: 100vh;
      }

      h1 {
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      h1 svg {
        flex-shrink: 0;
      }

      .setting {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      label {
        font-size: 0.875rem;
      }

      input[type="color"] {
        width: 36px;
        height: 28px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background: none;
        padding: 0;
      }

      input[type="range"] {
        width: 100px;
        accent-color: #ffd700;
      }

      .toggle {
        position: relative;
        display: inline-block;
        width: 42px;
        height: 24px;
      }

      .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: #45475a;
        border-radius: 24px;
        transition: 0.2s;
      }

      .slider:before {
        content: "";
        position: absolute;
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background: #cdd6f4;
        border-radius: 50%;
        transition: 0.2s;
      }

      input:checked + .slider {
        background: #ffd700;
      }

      input:checked + .slider:before {
        transform: translateX(18px);
        background: #1e1e2e;
      }

      .value-label {
        font-size: 0.75rem;
        color: #a6adc8;
        min-width: 24px;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <h1>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
        <circle cx="12" cy="12" r="9" fill="none" stroke="#ffd700" stroke-width="2.5"/>
        <circle cx="12" cy="12" r="4" fill="#ffd700" fill-opacity="0.5"/>
      </svg>
      Turn Highlighter
    </h1>

    <div class="setting">
      <label for="enabled">Enabled</label>
      <label class="toggle">
        <input type="checkbox" id="enabled" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting">
      <label for="color">Color</label>
      <input type="color" id="color" value="#ffd700" />
    </div>

    <div class="setting">
      <label for="width">Ring width</label>
      <input type="range" id="width" min="2" max="30" value="10" />
      <span class="value-label" id="width-value">10</span>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
